services:
  users:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: users
    environment:
      ADDR: ":8081"
    ports:
      - "8081:8081"

  orders:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: orders
    environment:
      ADDR: ":8082"
    ports:
      - "8082:8082"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"
    depends_on:
      - users

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      ADDR: ":8080"
      USERS_URL: "http://toxiproxy:8666"
      ORDERS_URL: "http://orders:8082"
    ports:
      - "8080:8080"
    depends_on:
      - toxiproxy
      - orders
